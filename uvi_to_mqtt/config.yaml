name: "UVI Verbrauch -> MQTT"
version: "3.0.0"
slug: "uvi_to_mqtt"
description: "Liest Heizkosten/Warmwasser/Kaltwasser aus dem Immobilien-Hasler-Mieterportal (UVI) und veröffentlicht sie per MQTT Discovery für Home Assistant."
arch:
  - amd64
startup: application
boot: auto
init: false
homeassistant_api: true
options:
  uvi_email: ""
  uvi_password: ""
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  run_day_of_month: 1
  run_hour: 6
  timezone: "Europe/Berlin"
  run_on_start: true
schema:
  uvi_email: str
  uvi_password: password
  mqtt_host: str
  mqtt_port: int
  mqtt_username: str?
  mqtt_password: password?
  run_day_of_month: int(1,28)
  run_hour: int(0,23)
  timezone: str
  run_on_start: bool
